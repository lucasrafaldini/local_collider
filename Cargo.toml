[package]
name = "local_collider"
version = "0.1.0"
edition = "2021"
description = "A CLI particle accelerator simulator that trades real CPU compute for relativistic particle acceleration and quantum discoveries, with a separate live TUI animation client."
license = "MIT"
repository = "https://github.com/lucasrafaldini/local_collider"
keywords = ["cli", "tui", "physics", "particle-accelerator", "simulator"]
categories = ["command-line-utilities", "simulation", "games"]
default-run = "local-collider"

[lib]
name = "local_collider"
path = "src/lib.rs"

[[bin]]
name = "local-collider"
path = "src/main.rs"

[[bin]]
name = "collider-engine"
path = "src/bin/collider_engine.rs"

[[bin]]
name = "collider-viz"
path = "src/bin/collider_viz.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
