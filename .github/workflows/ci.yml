name: CI & macOS App Bundle

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Rust Tests & macOS Bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        run: cargo test --verbose

      - name: Build Release Binaries & macOS App Bundle
        run: ./scripts/build_macos_app.sh
